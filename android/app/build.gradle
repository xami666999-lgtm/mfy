plugins {
    id "com.android.application"
}
android {
    namespace "com.mfy.tv"
    compileSdk 34
    defaultConfig {
        applicationId "com.mfy.tv"
        minSdk 21
        targetSdk 34
        versionCode 176
        versionName "1.7.6"
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
