name: Release iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:web
      - name: Add Capacitor iOS project
        run: |
          npx cap add ios || true
          npx cap sync ios
      - name: CocoaPods
        run: |
          cd ios/App
          pod install --repo-update
      - name: Unsigned device build
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Pack IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'App.app' | head -n 1)
          if [ -z "$APP" ]; then APP=$(find . -name 'App.app' | head -n 1); fi
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/MFY.app
          VER=$(node -p "require('./package.json').version")
          zip -r "MFY-iOS-$VER.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MFY-iOS-ipa
          path: MFY-iOS-*.ipa
          if-no-files-found: error
      - name: Publish separate iOS GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="ios-v$VER"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "$TAG" || true
          git push origin "$TAG" || true
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" "MFY-iOS-$VER.ipa" \
            --title "MFY iOS $VER (IPA)" \
            --notes "Phone-style MFY wrap. File: **MFY-iOS-$VER.ipa**. Unsigned — install with Sideloadly on Windows. This release is separate from Windows Setup so auto-update stays on v$VER exe." \
            --target ${{ github.sha }} \
            --latest=false
