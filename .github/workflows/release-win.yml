name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build NSIS Setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx vite build && npx electron-builder --win --x64 --publish never
      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: MFY-Setup
          path: |
            release/MFY-Setup-*.exe
            release/latest.yml
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = node -p "require('./package.json').version"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -f "v$ver"
          git push -f origin "v$ver"
          gh release delete "v$ver" -y 2>$null
          $files = @("release/MFY-Setup-$ver.exe")
          if (Test-Path "release/latest.yml") { $files += "release/latest.yml" }
          if (Test-Path "release/MFY-Setup-$ver.exe.blockmap") { $files += "release/MFY-Setup-$ver.exe.blockmap" }
          gh release create "v$ver" @files --title "$ver themes + Jellyfin sidecar" --notes "Windows Setup. Settings Themes: Netflix, Apple TV, Max. Then add Jellyfin plugins from Settings." --target ${{ github.sha }}
