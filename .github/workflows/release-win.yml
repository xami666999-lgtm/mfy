name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build NSIS Setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx vite build && npx electron-builder --win --x64 --publish never
      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: MFY-Setup-1.7.6
          path: release/MFY-Setup-*.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = node -p "require('./package.json').version"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "v$ver"
          git push origin "v$ver"
          gh release create "v$ver" "release/MFY-Setup-$ver.exe" --title "$ver 1.6.69 + intro" --notes "Full 1.6.69 app with launch intro." --target ${{ github.sha }}
        continue-on-error: true
