name: Unlock pages
on: workflow_dispatch
permissions:
  deployments: write
jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Mark pages deployments inactive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/deployments?per_page=40" --jq '.[] | "\(.id) \(.environment) \(.created_at)"'
          for id in $(gh api "repos/${{ github.repository }}/deployments?per_page=40" --jq '.[] | select(.environment=="github-pages") | .id'); do
            echo "inactive $id"
            gh api --method POST "repos/${{ github.repository }}/deployments/${id}/statuses" -f state=inactive -f description=release || true
          done
