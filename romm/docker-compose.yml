version: "3.8"

services:
  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=a1b2c3d4e5f6g7h8
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - MARIADB_PASSWORD=i9j0k1l2m3n4o5p6
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm-user
      - DB_PASSWD=i9j0k1l2m3n4o5p6
      - ROMM_AUTH_SECRET_KEY=af652208a1e4efdfce263a2031499399c5fa48158f108eb1ad484040deb26356
      - SCREENSCRAPER_USER=
      - SCREENSCRAPER_PASSWORD=
      - RETROACHIEVEMENTS_API_KEY=
      - STEAMGRIDDB_API_KEY=
      - HASHEOUS_API_ENABLED=true
    volumes:
      - romm_resources:/romm/resources
      - ./library:/romm/library:ro
      - ./assets:/romm/assets
      - ./config:/romm/config
    ports:
      - "8080:8080"
    depends_on:
      romm-db:
        condition: service_healthy

volumes:
  mysql_data:
  romm_resources: